name: Bug report
description: Something does not work the way this repository says it does.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The smallest content and config that shows it. For anything about
        translations, paste the output of `npm run i18n:status`.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit you are on, and your Node version.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I am not reporting a problem with AI Glot itself (credits, keys, translation quality).
          required: true
        - label: I did not hand-edit a generated file.
          required: true
